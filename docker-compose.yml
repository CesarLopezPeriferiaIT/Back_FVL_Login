services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev_ChangeMe_2026}
      MSSQL_PID: Developer
    volumes:
      - sqlserver_data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      # Ambas rutas permiten usar imagenes con versiones distintas de sqlcmd.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: dev
      PORT: "3000"
      DB_SERVER: sqlserver
      DB_PORT: "1433"
      DB_DATABASE: FVL_Login
      DB_TRUST_SERVER_CERTIFICATE: "true"
      MAIL_TRANSPORT: console
      LOG_LEVEL: info
      TRUSTED_PROXY_CIDRS: "127.0.0.1/32,::1/128"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    profiles: ["tls"]
    depends_on:
      - api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "443:443"
      - "80:80"
    # Las cabeceras de seguridad las emite la aplicacion mediante helmet.

volumes:
  sqlserver_data:
