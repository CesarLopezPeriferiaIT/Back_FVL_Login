services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Base de datos local para desarrollo aislado. No se levanta por defecto: el servicio usa la
    # instancia desplegada que se indique en el archivo .env. Para usarla:
    #   docker compose --profile local-db up -d
    # y definir DB_SERVER=sqlserver en el archivo .env.
    profiles: ["local-db"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev_ChangeMe_2026}
      MSSQL_PID: Developer
    volumes:
      - sqlserver_data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      # Ambas rutas permiten usar imagenes con versiones distintas de sqlcmd.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: dev
      PORT: "3000"
      MAIL_TRANSPORT: console
      LOG_LEVEL: info
      TRUSTED_PROXY_CIDRS: "127.0.0.1/32,::1/128"
      # Los secretos no tienen valor por defecto: compose los toma del archivo .env de la raiz del
      # proyecto y falla de forma explicita si no estan definidos. El .env nunca se versiona.
      # La conexion a la base de datos sale tambien del .env: servidor, puerto, base de datos,
      # usuario, contrasena, cifrado y confianza en el certificado.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET en el archivo .env}
      JWT_CONFIRM_SECRET: ${JWT_CONFIRM_SECRET:?defina JWT_CONFIRM_SECRET en el archivo .env}
      JWT_RESET_SECRET: ${JWT_RESET_SECRET:?defina JWT_RESET_SECRET en el archivo .env}
      DB_USER: ${DB_USER:?defina DB_USER en el archivo .env}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD en el archivo .env}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    profiles: ["tls"]
    depends_on:
      - api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      # Archivos de verificacion de enlaces de app y universal que exige la aplicacion movil.
      - ./nginx/well-known:/etc/nginx/well-known:ro
    ports:
      - "443:443"
      - "80:80"
    # Las cabeceras de seguridad las emite la aplicacion mediante helmet.

volumes:
  sqlserver_data:
