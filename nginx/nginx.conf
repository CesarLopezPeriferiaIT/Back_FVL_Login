server_tokens off;
client_max_body_size 1m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # Archivos de verificacion de enlaces de app y universal.
    #
    # La aplicacion movil abre desde el correo de confirmacion y de reseteo de contrasena, y el
    # enlace debe abrir la aplicacion en lugar del navegador. Para lograrlo, la app declara este
    # dominio como enlace de app en Android y como enlace universal en iOS, lo que exige que el
    # dominio del backend sirva dos archivos de verificacion:
    #
    #   /.well-known/assetlinks.json             Android, con la huella del certificado de firma
    #   /.well-known/apple-app-site-association iOS, con el identificador del equipo y el bundle
    #
    # El contenido lo entrega el equipo de la aplicacion movil y se monta aqui como solo lectura.
    # Limitar las rutas declaradas en el archivo de iOS a las del flujo de autenticacion evita que
    # cualquier otra direccion del backend abra la aplicacion.
    location /.well-known/ {
        alias /etc/nginx/well-known/;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    # La aplicacion emite las cabeceras de seguridad mediante helmet para evitar duplicados.
    location / {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
